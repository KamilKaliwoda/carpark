version: '1.0'

services:
  carpark-app:
    build:
      context: .
      dockerfile: ./apps/carpark-app/Dockerfile
    image: carpark-app
    ports:
      - 8132:8132
    expose:
      - 8132
    env_file:
      - ./apps/carpark-app/.env.docker
    command: node ./main.js

  carpark-web:
    build:
      context: ./apps/carpark-web
      dockerfile: Dockerfile
    image: carpark-web
    ports:
      - 8131:8131
    expose:
      - 8131
    depends_on:
      - carpark-app
    env_file:
      - ./apps/carpark-web/.env.docker
    command: npm start
  